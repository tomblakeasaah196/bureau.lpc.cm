; ============================================================================
; .user.ini — per-directory PHP settings honoured by cPanel's PHP-FPM.
;
; cPanel reads this file on request and merges it into the effective ini for
; every PHP script under the current directory tree. It is the ONLY way to
; change php.ini values on the shared host without root, and unlike
; ini_set() at runtime, it applies to PHP_INI_SYSTEM directives too — which
; is what OPcache needs.
;
; Reload delay: cPanel re-reads .user.ini at most every `user_ini.cache_ttl`
; seconds (default 300). A change here can therefore take up to 5 minutes
; to take effect. To force an immediate reload after editing, run one of:
;   · touch this file and wait 5 min
;   · from cPanel → Multi-PHP Manager, toggle the PHP version and back
;   · from cPanel → Terminal: `killall -USR2 php-fpm` if you have that reach
;
; Kept in the repo so a fresh clone / restore matches production.
; ============================================================================


; ---- OPcache ---------------------------------------------------------------
; The single biggest server-side win on shared hosting: with OPcache on, each
; .php file is compiled to bytecode ONCE per FPM worker and re-used on every
; subsequent request, instead of being re-parsed by the Zend engine each hit.
; On this app (~200 files, ~30k LOC), that turns a typical page's PHP time
; from ~120 ms into ~20 ms warm.
;
; cPanel's ea-php83 ships OPcache but leaves it configured conservatively —
; low memory, aggressive timestamp revalidation. These values are tuned for a
; live app that redeploys via `git pull` on the shared host.

opcache.enable=1
opcache.enable_cli=0

; 128 MB is well above what this app needs (~60 MB warm), leaving headroom
; for the vendor tree and any future modules without triggering a reset.
opcache.memory_consumption=128

; String interning pool. 8 MB is enough for this codebase's ~4k strings.
opcache.interned_strings_buffer=8

; Room for every .php file in modules/, includes/, public/ and vendor/.
; Current count is ~1200 including composer's autoload map; 4000 is 3× that
; and keeps the hash table sparse enough that lookups stay O(1).
opcache.max_accelerated_files=4000

; Timestamp validation:
;   validate_timestamps=1 + revalidate_freq=2  =>  OPcache re-stats every file
;   every 2 s. In production this is wasted syscalls: files only change on a
;   deploy. Set validate_timestamps=0 and reset OPcache manually on deploy
;   (see .htaccess note below) for the fastest possible page.
;
;   For now we keep validation ON with a 60-second window so an ad-hoc edit
;   on the server (or the git pull that IS the deploy) picks up automatically.
;   Flip to 0 once the deploy pipeline reliably calls opcache_reset().
opcache.validate_timestamps=1
opcache.revalidate_freq=60

; Fast shutdown skips the recursive free of every zval at request end — the
; OS reclaims it anyway. Trims a few ms per request at no risk to userland.
opcache.fast_shutdown=1

; Save the compiled bytecode's file/line info even under opcache — we want
; useful stack traces when something throws in production.
opcache.save_comments=1


; ---- Realpath cache --------------------------------------------------------
; Every include_once / require_once resolves a real filesystem path. The
; realpath cache stores those resolutions; a small default (16k, 120 s) means
; a large include tree like Composer's autoloader hits the disk repeatedly.
; A 4 MB / 10 min window fits every unique path this app touches with room
; to spare, and eliminates lstat() churn between requests.

realpath_cache_size=4096K
realpath_cache_ttl=600


; ---- Session -------------------------------------------------------------
; Match the app's own expectations. The bootstrap sets these via ini_set()
; too, so this section is defence-in-depth against a request that reaches
; PHP without hitting bootstrap.php (there aren't any today, but the
; assumption gets less safe with each new endpoint).

session.use_strict_mode=1
session.use_only_cookies=1
session.cookie_httponly=1
session.cookie_samesite=Lax


; ---- Output ---------------------------------------------------------------
; Let Apache negotiate Brotli/gzip if mod_brotli/mod_deflate are compiled in.
; This keeps PHP from spending CPU on ob_gzhandler when Apache already will.

zlib.output_compression=Off


; ---- Uploads --------------------------------------------------------------
; Sized for the biggest thing the app currently accepts: a scanned invoice
; PDF (~15 MB). Bump both together if that changes.

upload_max_filesize=20M
post_max_size=22M
memory_limit=256M
