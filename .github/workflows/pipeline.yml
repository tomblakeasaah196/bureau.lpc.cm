# Tests on every push and pull request; on main, a green run is released to the `production` branch, which the
# server polls and deploys (deploy/server/bureau-deploy.sh, runbook docs/DEPLOY.md). No secrets: the release push
# uses the workflow's own token, and the server reads this public repository over HTTPS.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code checks (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, gd, dom, xml
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nothing secret is tracked (the repository is public)
        run: |
          fail=0
          if git ls-files | grep -qxE '\.env|.*/\.env'; then echo "::error::an .env file is tracked"; fail=1; fi
          dumps=$(git ls-files | grep -iE '\.(sql|sql\.gz|dump)$' | grep -vE '^(migrations|scripts/tests)/' || true)
          if [ -n "$dumps" ]; then echo "$dumps"; echo "::error::a database dump is tracked"; fail=1; fi
          if git ls-files 'uploads/*' | grep -vE '(^|/)(\.gitkeep|\.htaccess)$'; then echo "::error::an uploaded file is tracked"; fail=1; fi
          exit $fail
      - name: Composer
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax (every tracked .php file)
        run: |
          git ls-files -z '*.php' | xargs -0 -n1 -P4 sh -c 'php -l "$0" >/dev/null 2>&1 || { php -l "$0"; exit 255; }'
          echo "$(git ls-files '*.php' | wc -l) files parse"
      - name: Migrations (numbering, duplicates, idempotency)
        run: php scripts/tests/migration_lint.test.php
      - name: Accounting and invoicing tests
        run: |
          python3 scripts/tests/syscohada_postings.test.py
          python3 scripts/tests/ledger_mapping.test.py
          python3 scripts/tests/to_invoice_query.test.py
      - name: Front-end tests
        run: |
          node scripts/tests/product_picker.test.js
          node scripts/tests/facture_render.test.js "$PWD"
      - name: Document tests (QR, one-page quote and payslip PDFs, header, signature cell and signature hashes)
        run: |
          command -v pdftotext >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null; }
          php scripts/tests/qr_render.test.php
          php scripts/tests/quote_onepager.test.php
          php scripts/tests/payslip_onepager.test.php
          python3 scripts/tests/document_header.test.py
          php scripts/tests/signature_canonical_payload.test.php
      - name: Account recovery (masked address, reset-link guarantees)
        run: php scripts/tests/account_recovery.test.php
      - name: Quick sign-in (passkey checks with real keys, PIN rules, wiring)
        run: php scripts/tests/quick_signin.test.php
      - name: Données de Base (who may read and write, what a save keeps)
        run: php scripts/tests/master_data_access.test.php
      - name: Gestion des Achats (who orders, receives and pays; what each step books)
        run: php scripts/tests/procurement_flow.test.php
      - name: Flotte (one gate, Operations runs the fleet, costs reach Dépenses as requests)
        run: php scripts/tests/fleet_flow.test.php
      - name: Stock & Emballages (avarie, inventory, refusals in 31x; the Fiche de Stock)
        run: php scripts/tests/stock_flow.test.php
      - name: Proposition commerciale (a signed devis carries prices, terms and empties downstream)
        run: php scripts/tests/proposal_flow.test.php
      - name: Ventes & Commandes (LPC's truck and staff drivers, Ops closes, remises given once, cancelling after a BL)
        run: php scripts/tests/sales_flow.test.php
      - name: Gestion du Personnel (advances, the month's payroll, undo, paying, FNE and the DIPE)
        run: php scripts/tests/payroll_flow.test.php
      - name: Trésorerie & Dépenses (one gate, who pays, opening balances, the fuel check)
        run: php scripts/tests/treasury_expenses.test.php
      - name: Administration (settings reads and writes, sessions that end, the audit trail, roles)
        run: php scripts/tests/admin_settings.test.php

  mail:
    # Courrier (docs/MAIL.md §9): every scripts/tests/mail/*.test.php, each blocking. PR 1's three: the engine
    # without a server, the IMAP and SMTP clients over real sockets against scripted servers, then sync,
    # threads, access, actions and Boîtes mail on a throwaway MariaDB 10.11 (the server's version) with the
    # in-memory FakeMailServer. PRs 2-5 add their own files there and never edit this job. Never a real
    # mailbox or password.
    name: Courrier tests (engine, sockets, MariaDB 10.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, openssl
          coverage: none
      - name: Every Courrier test (scripts/tests/mail/*.test.php)
        env:
          MAIL_TEST_DB_HOST: 127.0.0.1
          MAIL_TEST_DB_PORT: '3306'
          MAIL_TEST_DB_USER: root
        run: |
          fail=0
          for f in scripts/tests/mail/*.test.php; do
            echo "::group::$f"
            php "$f" || { echo "::error file=$f::$f failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

  wipe:
    # Document numbering (DocCounter, migration 350) and the data wipe tool: every
    # scripts/tests/wipe/*.test.php, each blocking, on a throwaway MariaDB 10.11
    # (the server's version) built from scripts/tests/wipe/support/fixture_schema.sql
    # plus migrations 350-359. No client data.
    name: Numbering and data wipe tests (MariaDB 10.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip
          coverage: none
      - name: Every numbering and wipe test (scripts/tests/wipe/*.test.php)
        env:
          WIPE_TEST_DB_HOST: 127.0.0.1
          WIPE_TEST_DB_PORT: '3306'
          WIPE_TEST_DB_USER: root
        run: |
          fail=0
          for f in scripts/tests/wipe/*.test.php; do
            echo "::group::$f"
            php "$f" || { echo "::error file=$f::$f failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

  help_videos:
    # Training videos (migration 126, docs/HELP_VIDEOS.md): every
    # scripts/tests/help_videos/*.test.php, each blocking, on a throwaway
    # MariaDB 10.11 (the server's version) built from support/fixture_schema.sql
    # plus migrations 032 and 126. The HTTP test serves the repository with
    # `php -S`. A tiny MP4 is made with ffmpeg at test time; no media is
    # committed.
    name: Training video tests (MariaDB 10.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: ffmpeg (makes the test MP4)
        run: command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
      - name: Every training video test (scripts/tests/help_videos/*.test.php)
        env:
          HELPVID_TEST_DB_HOST: 127.0.0.1
          HELPVID_TEST_DB_PORT: '3306'
          HELPVID_TEST_DB_USER: root
        run: |
          fail=0
          for f in scripts/tests/help_videos/*.test.php; do
            echo "::group::$f"
            php "$f" || { echo "::error file=$f::$f failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

  deployer:
    name: Deployer tests (deploy/server)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n deploy/server/bureau-deploy.sh
      - name: Releases against a throwaway server home (stubs for php, mysqldump, curl, uapi)
        run: bash deploy/server/tests/deploy-test.sh

  release:
    name: Release to production
    needs: [checks, mail, wipe, help_videos, deployer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the CSS and the JS bundle (the server has no Node)
        run: |
          npm ci --no-audit --no-fund
          npm run build
          python3 scripts/build_theme_css.py
      - name: Commit the build on top of main and publish it as `production`
        run: |
          git config user.name "bureau-release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release
          git add -f assets/css/tailwind.css assets/css/lpc-theme.css assets/js/build
          git commit -q --allow-empty -m "Release ${GITHUB_SHA::7}: built assets for ${GITHUB_SHA}"
          git push -f origin HEAD:production
          {
            echo "### Released ${GITHUB_SHA::7}"
            echo "Built files that differ from main:"
            echo '```'
            git diff --stat HEAD~1 HEAD
            echo '```'
            echo "The server deploys \`production\` within a minute; its log is ~/deploy/bureau/logs (docs/DEPLOY.md)."
          } >> "$GITHUB_STEP_SUMMARY"
